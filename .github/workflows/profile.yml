name: Profile assets check

on:
  workflow_dispatch:
  push:
    paths:
      - "today.py"
      - "dark_mode.svg"
      - "light_mode.svg"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python today.py
